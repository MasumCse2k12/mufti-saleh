services:
  api:
    image: ${REGISTRY}/mufti-saleh-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT:-5432}/${DB_NAME:-mufti_saleh}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-localhost}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      APP_JWT_SECRET: ${JWT_SECRET}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS:-https://muftisaleh.com}
      APP_BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD}
      APP_BOOTSTRAP_DISPLAY_NAME: ${BOOTSTRAP_DISPLAY_NAME:-Super Admin}
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  web:
    image: ${REGISTRY}/mufti-saleh-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
