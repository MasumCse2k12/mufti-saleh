services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: mufti-saleh/api:latest
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-localhost}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      APP_JWT_SECRET: ${JWT_SECRET}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS:-https://muftisaleh.com}
      APP_BOOTSTRAP_USERNAME: ${BOOTSTRAP_USERNAME:-admin}
      APP_BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD}
      APP_BOOTSTRAP_DISPLAY_NAME: ${BOOTSTRAP_DISPLAY_NAME:-Super Admin}
      LOGGING_LEVEL_ROOT: ${LOG_LEVEL:-ERROR}
      SPRINGDOC_SWAGGER_UI_ENABLED: ${SWAGGER_ENABLED:-false}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: mufti-saleh/web:latest
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  redis_data:
