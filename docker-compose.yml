services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mufti_saleh
      POSTGRES_USER: mufti_saleh
      POSTGRES_PASSWORD: mufti_saleh
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mufti_saleh"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
