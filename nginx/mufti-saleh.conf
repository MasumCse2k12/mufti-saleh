upstream mufti_saleh_api {
    server 127.0.0.1:8082;
    keepalive 32;
}

upstream mufti_saleh_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name muftisaleh.com www.muftisaleh.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name muftisaleh.com www.muftisaleh.com;

    ssl_certificate     /etc/letsencrypt/live/muftisaleh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muftisaleh.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass         http://mufti_saleh_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        proxy_pass         http://mufti_saleh_web;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
